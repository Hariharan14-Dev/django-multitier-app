services:

  db:
    image: postgres:18-alpine
    container_name: worknest-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: worknest
      POSTGRES_USER: worknest_user
      POSTGRES_PASSWORD: worknest_password

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worknest_user -d worknest"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build: .
    container_name: worknest-web
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      DJANGO_SECRET_KEY: "change-this-in-production"
      DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"

      POSTGRES_DB: "worknest"
      POSTGRES_USER: "worknest_user"
      POSTGRES_PASSWORD: "worknest_password"
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: