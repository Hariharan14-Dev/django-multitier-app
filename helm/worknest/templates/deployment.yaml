apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worknest.fullname" . }}
  labels:
    app: {{ include "worknest.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: {{ include "worknest.name" . }}

  template:
    metadata:
      labels:
        app: {{ include "worknest.name" . }}

    spec:
      containers:
        - name: worknest
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: 8000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: {{ include "worknest.fullname" . }}-config

            - secretRef:
                name: {{ include "worknest.fullname" . }}-secret

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20