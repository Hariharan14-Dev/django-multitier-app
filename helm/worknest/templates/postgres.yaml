apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "worknest.fullname" . }}-postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: {{ include "worknest.name" . }}-postgres

  template:
    metadata:
      labels:
        app: {{ include "worknest.name" . }}-postgres

    spec:
      containers:
        - name: postgres

          image: {{ .Values.postgresql.image }}

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.database | quote }}

            - name: POSTGRES_USER
              value: {{ .Values.postgresql.username | quote }}

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "worknest.fullname" . }}-secret
                  key: POSTGRES_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: {{ include "worknest.fullname" . }}-postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "worknest.fullname" . }}-postgres

spec:
  type: ClusterIP

  selector:
    app: {{ include "worknest.name" . }}-postgres

  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "worknest.fullname" . }}-postgres-pvc

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: {{ .Values.postgresql.storage }}