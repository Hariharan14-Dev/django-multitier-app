<!DOCTYPE html>
<html>

<head>
    <title>{{ title }}</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f4f4;
            margin:0;
            padding:0;
        }

        .navbar{
            background:#222;
            color:white;
            padding:20px;
            text-align:center;
        }

        .container{
            width:80%;
            margin:auto;
            margin-top:40px;
        }

        .card{
            background:white;
            padding:20px;
            margin-bottom:20px;
            border-radius:10px;
            box-shadow:0px 2px 5px rgba(0,0,0,0.2);
        }

        .completed{
            color:green;
            font-weight:bold;
        }

        .pending{
            color:red;
            font-weight:bold;
        }

        input, textarea{
            width:100%;
            padding:10px;
            margin-top:10px;
            margin-bottom:15px;
        }

        button{
            background:#222;
            color:white;
            border:none;
            padding:12px 20px;
            cursor:pointer;
        }

    </style>
</head>

<body>

<div class="navbar">
    <h1>{{ title }}</h1>
</div>

<div class="container">

    <div class="card">

        <h2>Create Task</h2>

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="title"
                placeholder="Enter Task Title"
                required
            >

            <textarea
                name="description"
                placeholder="Enter Task Description"
                required
            ></textarea>

            <button type="submit">
                Add Task
            </button>

        </form>

    </div>

    <h2>Task Dashboard</h2>

    {% for task in tasks %}

    <div class="card">

        <h3>{{ task.title }}</h3>

        <p>{{ task.description }}</p>

        <p>
            Created:
            {{ task.created_at }}
        </p>

        {% if task.completed %}
            <p class="completed">
                Completed
            </p>
        {% else %}
            <p class="pending">
                Pending
            </p>
        {% endif %}

    </div>

    {% empty %}

    <div class="card">
        <h3>No Tasks Available</h3>
    </div>

    {% endfor %}

</div>

</body>
</html>
