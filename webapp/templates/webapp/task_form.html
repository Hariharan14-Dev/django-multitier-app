{% extends "webapp/base.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block content %}

<div class="form-container">

    <h1>{{ title }}</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button
            type="submit"
            class="button"
        >
            {{ button_text }}
        </button>

        <a href="{% url 'task_list' %}">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
